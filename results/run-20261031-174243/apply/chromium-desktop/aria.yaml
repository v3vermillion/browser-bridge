- main:
  - text: Help me
  - heading "Apply for help" [level=1]
  - paragraph: Households with children and seniors are our focus, but anyone who is struggling right now can apply.
  - paragraph: Four short steps. Your answers go straight to us by email, and we'll follow up from there.
  - img "Children holding holiday gift bags beside a volunteer in a Santa hat"
  - region "Application form":
    - heading "Application form" [level=2]
