    - paragraph: Helping families since 2015 501(c)(3) nonprofit, EIN 47-4917287 Partnered with Toys for Tots
  - region "What we do, all year":
    - text: Our programs
    - heading "What we do, all year" [level=2]
    - paragraph: We create and manage programs that support the physical and emotional well-being of families in Central Indiana who are facing financial hardship.
    - navigation "Jump to a program":
      - list:
        - listitem:
          - link "A mother with her arm around her young daughter, choosing a toy at a holiday giveaway Holiday Assistance Thanksgiving, Christmas, Easter":
            - /url: "#holiday-assistance"
            - img "A mother with her arm around her young daughter, choosing a toy at a holiday giveaway"
            - text: Holiday Assistance Thanksgiving, Christmas, Easter
        - listitem:
          - link "The pantry's shelves stacked with packs of diapers, each labelled with the organization's heart Diaper Drive Diapers every month":
            - /url: "#diaper-drive"
            - img "The pantry's shelves stacked with packs of diapers, each labelled with the organization's heart"
            - text: Diaper Drive Diapers every month
        - listitem:
          - link "Buckets of colored pencils, school scissors, pencils and highlighters on a shelf Back-to-School Care Packages Hygiene and school supplies":
            - /url: "#back-to-school"
            - img "Buckets of colored pencils, school scissors, pencils and highlighters on a shelf"
            - text: Back-to-School Care Packages Hygiene and school supplies
        - listitem:
          - link "A boy gets a free haircut from a volunteer stylist Free Haircuts & Styles Cuts, styles, face painting":
            - /url: "#haircuts"
            - img "A boy gets a free haircut from a volunteer stylist"
            - text: Free Haircuts & Styles Cuts, styles, face painting
    - heading "Get help" [level=3]
    - paragraph: Households with children and seniors are our focus, but anyone who is struggling right now can apply.
    - paragraph: Prefer to talk to someone first? Call or email us, and we'll send you an application.
    - link "Start an application":
      - /url: /apply/
    - link "Call (317) 886-0724":
      - /url: tel:+13178860724
    - link "Email us":
      - /url: mailto:caringforacause2015@gmail.com?subject=Application%20request
    - article:
      - text: Thanksgiving, Christmas, Easter
      - heading "Holiday Assistance" [level=3]
      - paragraph: Food boxes and gifts, so every household has a holiday meal and something to open.
      - paragraph: Who it's for Low-income families in Central Indiana, especially households with children.
      - list:
        - listitem: Families can receive toys, clothes, gift cards, meals, or gifts from their wish list.
        - listitem: Sponsors choose a family and help fill their holiday needs.
        - listitem: We partner with Toys for Tots.
      - paragraph:
        - link "Sponsor a family":
          - /url: /#sponsor
      - img "A mother with her arm around her young daughter, choosing a toy at a holiday giveaway"
    - article:
      - text: Diapers every month
      - heading "Diaper Drive" [level=3]
      - paragraph: A reliable supply, plus referrals to partner resources.
      - paragraph: Who it's for Families with babies and toddlers who need help with diapers.
      - paragraph:
        - link "Partner on the Diaper Drive":
          - /url: /#partner
      - img "The pantry's shelves stacked with packs of diapers, each labelled with the organization's heart"
    - article:
      - text: Hygiene and school supplies
      - heading "Back-to-School Care Packages" [level=3]
      - paragraph: Hygiene items and school supplies for girls and boys in our community.
      - paragraph: Who it's for Students from families who need help getting ready for school.
      - group: See what we're collecting
      - img "Buckets of colored pencils, school scissors, pencils and highlighters on a shelf"
    - article:
      - text: Cuts, styles, face painting
      - heading "Free Haircuts & Styles" [level=3]
      - paragraph: Volunteer barbers and stylists cut and style hair at our outreach events; makeup artists and face painters join them.
      - paragraph: Who it's for People experiencing homelessness and low-income families.
      - paragraph:
        - link "Offer your skills at a haircut event":
          - /url: /#partner
      - 'link "Play video: Free haircuts and styles outreach program"':
        - /url: https://www.youtube.com/watch?v=Z5USx1xFF58
  - region "Four ways to help":
    - text: Get involved
    - heading "Four ways to help" [level=2]
    - paragraph: Choose how you'd like to help.
    - tablist "Four ways to help":
      - tab "Sponsor a family" [selected]
      - tab "Donate"
      - tab "Volunteer"
      - tab "Partner"
    - tabpanel "Sponsor a family":
      - heading "Sponsor a family for the holidays" [level=3]
      - paragraph: Sponsors provide a family with gifts from their wish list, a holiday meal, or both.
      - paragraph: You may sponsor one family or several, for a single holiday or for all three.
      - paragraph:
        - link "Email us to sponsor":
          - /url: mailto:caringforacause2015@gmail.com?subject=Sponsoring%20a%20family%20for%20the%20holidays
      - img "A young boy grins as he holds up the superhero toy he chose at a holiday giveaway"
  - region "Meet Tamara Long-Ajimati":
    - figure:
      - img "Tamara Long-Ajimati, founder of Caring for a Cause, smiling outside in a red top"
    - text: About
    - heading "Meet Tamara Long-Ajimati" [level=2]
    - paragraph: Tamara founded Caring for a Cause in 2015 to support families in Central Indiana who are facing financial hardship. Year after year since then, she and her volunteers have helped thousands of families.
    - paragraph: The organization has grown thanks to the helping hands of this community.
    - paragraph:
      - link "Watch her story":
        - /url: https://www.youtube.com/watch?v=7smWzJwY9kA
