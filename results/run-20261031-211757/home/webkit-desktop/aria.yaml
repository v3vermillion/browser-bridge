  - region "Holiday meals, gifts, and diapers for Central Indiana families.":
    - paragraph: Together we can.
    - heading "Holiday meals, gifts, and diapers for Central Indiana families." [level=1]
    - paragraph: A nonprofit for households facing financial hardship.
